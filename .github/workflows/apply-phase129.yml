name: Apply Phase129

on:
  push:
    branches:
      - deploy/phase129-2026-09-17

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: deploy/phase129-2026-09-17
          fetch-depth: 0

      - name: Reconstruct and apply Phase129
        shell: bash
        run: |
          cat .phase129-payload.part* > /tmp/phase129_payload.b64
          rm .phase129-payload.part*
          python3 .phase129-deploy.py

      - name: Remove temporary deployment files
        shell: bash
        run: |
          rm .phase129-deploy.py
          rm .github/workflows/apply-phase129.yml

      - name: Commit exact Phase129 package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy SolQvia Phase129 [skip ci]"
          git push origin HEAD:deploy/phase129-2026-09-17
